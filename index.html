function VLogo({ size = 28, opacity = 1, glow }) {
  return (
    <img
      src={LOGO_B64}
      alt=""
      draggable={false}
      style={{ width: size, height: size, objectFit: 'contain', opacity, display: 'block', pointerEvents: 'none', filter: glow ? 'drop-shadow(0 0 10px rgba(43,212,255,0.7))' : 'none' }}
    />
  );
}
function Avatar({ s = 44 }) {
  return (
    <div style={{ width: s, height: s, borderRadius: '50%', background: 'linear-gradient(160deg,#26262C,#060608)', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden', boxShadow: '0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -9px 16px rgba(43,212,255,0.35)' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '46%', background: 'linear-gradient(180deg,rgba(255,255,255,0.2),transparent)' }} />
      <VLogo size={s * 0.5} color="#fff" stroke={11} glow />
    </div>
  );
}
function Header({ title, onBack }) {
  return (
    <div style={{ padding: '14px 16px 4px', display: 'flex', alignItems: 'center', gap: 10 }}>
      {onBack && (
        <button className="tap" onClick={() => { haptic('light'); onBack(); }} style={{ width: 38, height: 38, borderRadius: 12, display: 'grid', placeItems: 'center', flex: 'none', ...glass }}>
          <ChevronLeft size={22} color={c.text} />
        </button>
      )}
      <div style={{ fontSize: 27, fontWeight: 800, color: c.text, letterSpacing: -0.6, minWidth: 0, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</div>
    </div>
  );
}
function Label({ children }) {
  return <div style={{ padding: '14px 16px 0', fontSize: 12.5, fontWeight: 600, color: c.faint, letterSpacing: 0.5 }}>{children}</div>;
}
function Chips({ values, value, onPick, scroll }) {
  return (
    <div className={scroll ? 'noscroll' : ''} style={{ display: 'flex', flexWrap: scroll ? 'nowrap' : 'wrap', overflowX: scroll ? 'auto' : 'visible', gap: 9, padding: '8px 16px 0' }}>
      {values.map((v) => {
        const active = String(v) === String(value);
        return (
          <button key={v} className="tap" onClick={() => { haptic('light'); onPick(v); }} style={{ flex: '0 0 auto', borderRadius: 12, padding: '9px 15px', fontSize: 14, fontWeight: 600, ...num, ...(active ? glossy : { ...glass, color: c.sub }) }}>{v}</button>
        );
      })}
    </div>
  );
}
/* siljuvchi segment */

  const idx = Math.max(0, options.findIndex((o) => o[0] === value));
  const n = options.length;

/* ── qo'lda suriladigan davomiylik slayderi ── */
function DurationSlider({ steps, value, onChange }) {
  const trackRef = useRef(null);
  const draggingRef = useRef(false);
  const n = steps.length;
  const idx = Math.max(0, steps.indexOf(value));
  const pct = n > 1 ? (idx / (n - 1)) * 100 : 100;

  if (n < 2) {
    return (
      <div style={{ margin: '8px 16px 0', borderRadius: 16, padding: '13px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', ...glass }}>
        <span style={{ fontSize: 16, fontWeight: 800, color: c.text, ...num }}>{steps[0]} soniya</span>
        <span style={{ fontSize: 12, color: c.faint, fontWeight: 600 }}>{t('model_fixed','Bu model uchun belgilangan')}</span>
      </div>
    );
  }

  const pick = (clientX) => {
    const el = trackRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const rel = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    const ni = Math.round(rel * (n - 1));
    const nv = steps[ni];
    if (nv !== value) { haptic('light'); onChange(nv); }
  };
  const down = (e) => { draggingRef.current = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* noop */ } pick(e.clientX); };
  const move = (e) => { if (draggingRef.current) pick(e.clientX); };
  const up = () => { draggingRef.current = false; };

  return (
    <div style={{ margin: '8px 16px 0', borderRadius: 18, padding: '14px 18px 12px', userSelect: 'none', WebkitUserSelect: 'none', ...glass }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginBottom: 12 }}>
        <span style={{ fontSize: 34, fontWeight: 800, color: c.text, letterSpacing: -1.2, lineHeight: 1, ...num }}>{value}</span>
        <span style={{ fontSize: 14, color: c.sub, fontWeight: 600 }}>{t('seconds','soniya')}</span>
      </div>
      <div
        ref={trackRef}
        onPointerDown={down}
        onPointerMove={move}
        onPointerUp={up}
        onPointerCancel={up}
        onLostPointerCapture={up}
        style={{ position: 'relative', height: 38, touchAction: 'none', cursor: 'pointer' }}
      >
        <div style={{ position: 'absolute', top: '50%', left: 0, right: 0, height: 12, transform: 'translateY(-50%)', borderRadius: 999, background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.1)', boxShadow: 'inset 0 2px 6px rgba(0,0,0,0.5)' }} />
        <div style={{ position: 'absolute', top: '50%', left: 0, width: pct + '%', height: 12, transform: 'translateY(-50%)', borderRadius: 999, background: 'linear-gradient(180deg,#6FE4FF 0%,#21C7FF 50%,#06A6E6 100%)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.55), 0 0 20px rgba(43,212,255,0.55)', transition: 'width .16s cubic-bezier(.25,.8,.25,1)' }} />
        {steps.map((s, i) => {
          const p = (i / (n - 1)) * 100;
          return <div key={s} style={{ position: 'absolute', top: '50%', left: p + '%', width: 4, height: 4, borderRadius: '50%', transform: 'translate(-50%,-50%)', background: i <= idx ? 'rgba(0,22,31,0.4)' : 'rgba(255,255,255,0.3)', pointerEvents: 'none' }} />;
        })}
        <div style={{ position: 'absolute', top: '50%', left: pct + '%', transform: 'translate(-50%,-50%)', width: 27, height: 27, borderRadius: '50%', background: 'linear-gradient(180deg,#FFFFFF 0%,#DDEAF3 100%)', border: '1px solid rgba(255,255,255,0.95)', boxShadow: '0 3px 10px rgba(0,0,0,0.5), 0 0 18px rgba(43,212,255,0.7), inset 0 -3px 6px rgba(0,70,100,0.2)', transition: 'left .16s cubic-bezier(.25,.8,.25,1)', pointerEvents: 'none' }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
        <span style={{ fontSize: 12, color: c.faint, fontWeight: 600, ...num }}>{steps[0]}s</span>
        <span style={{ fontSize: 12, color: c.faint, fontWeight: 600, ...num }}>{steps[n - 1]}s</span>
      </div>
    </div>
  );
}

function ParamsScreen({ model, onBack, onSubmit }) {
  const meta = getMeta(model);
  const video = isVideoModel(model);
  const [res, setRes] = useState(meta.resolutions.length ? meta.resolutions[0] : null);
  const [asp, setAsp] = useState(meta.aspects.length ? meta.aspects[0] : null);
  const [dur, setDur] = useState(video && meta.dur_steps.length ? meta.dur_steps[0] : null);
  const [prompt, setPrompt] = useState('');
  const [enhancing, setEnhancing] = useState(false);
  const [enhErr, setEnhErr] = useState('');
  const [refs, setRefs] = useState([]);      /* [{id, url, preview, kind}] */
  async function doEnhance() {
    const idea = (prompt || '').trim();
    if (!idea || enhancing) return;
    setEnhErr(''); setEnhancing(true);
    try {
      const tg = TG();
      const headers = { 'Content-Type': 'application/json' };
      const initData = tg && tg.initData ? tg.initData : '';
      if (initData) headers['X-Tg-Init-Data'] = initData;
      const uid = URLQ.get('uid'), sig = URLQ.get('sig'), n = URLQ.get('n');
      if (uid && sig) { headers['X-Tg-Uid'] = uid; headers['X-Tg-Sig'] = sig; if (n) headers['X-Tg-Name'] = n; }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      let r;
      try {
        r = await fetch(API_BASE + '/tg/enhance', {
          method: 'POST', headers,
          body: JSON.stringify({ prompt: idea, mid: model.id, res, asp, dur }),
          signal: ctrl.signal
        });
      } finally { clearTimeout(timer); }
      let d = {};
      try { d = await r.json(); } catch (pe) { d = {}; }
      if (!r.ok) throw new Error(d.error || (t('err_code_prefix','Xato (') + r.status + ')'));
      if (d.prompt && d.prompt.trim()) {
        setPrompt(clampBytes(d.prompt.trim(), 3400));
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch (he) {}
      }
    } catch (e) {
      setEnhErr((e && e.message) ? e.message : t('enh_err','Yaxshilashda xato'));
    } finally { setEnhancing(false); }
  }
  const isSeedance = /seedance-2\.0/.test(model.id || '');   /* audio+video qabul qiladi */
  const needAudio = !!meta.needAudio || isSeedance;   /* audio bo'limi kerakmi */
  const needVideo = !!meta.needVideo || isSeedance;   /* video bo'limi kerakmi */
  const audioReq = !!meta.audReq;   /* audio majburiymi (InfiniteTalk) */
  const videoReq = !!meta.vidReq;
  const [upErr, setUpErr] = useState('');
  const [uploading, setUploading] = useState(false);
  const [uploadingKind, setUploadingKind] = useState(null);   /* 'image'|'video'|'audio' — faqat shu bo'limda spinner */
  const [uploadKey, setUploadKey] = useState(0);   /* input'ni qayta yaratish uchun — WebViewda Photo Library qotsa tiklanadi */
  const galleryTriedAt = React.useRef(0);          /* Galereya bosilgan vaqt — qotishni aniqlash uchun */
  const gotFileAfterTry = React.useRef(false);
  const reviveTimer = React.useRef(null);
  const uploadOne = async (file, kind) => {
    const preview = URL.createObjectURL(file);
    const fd = new FormData(); fd.append('file', file);
    const tg = TG();
    const headers = {};
    const initData = tg && tg.initData ? tg.initData : '';
    if (initData) headers['X-Tg-Init-Data'] = initData;
    const uid = URLQ.get('uid'), sig = URLQ.get('sig'), n = URLQ.get('n');
    if (uid && sig) { headers['X-Tg-Uid'] = uid; headers['X-Tg-Sig'] = sig; if (n) headers['X-Tg-Name'] = n; }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    let r;
    try {
      r = await fetch(API_BASE + '/tg/upload', { method: 'POST', headers, body: fd, signal: ctrl.signal });
    } finally { clearTimeout(timer); }
    let d = {};
    try { d = await r.json(); } catch (pe) { d = {}; }
    if (!r.ok) throw new Error(d.error || (t('upload_err_code','Yuklashda xato (') + r.status + ')'));
    if (!d.upload_id) throw new Error(t('server_err','Server javobida xato'));
    setRefs((prev) => [...prev, { id: d.upload_id, url: d.url, preview, kind: kind || d.kind || 'image', duration: d.duration || 0 }]);
  };

  const onFileKind = (kind) => async (e) => {
    gotFileAfterTry.current = true;
    galleryTriedAt.current = 0;
    if (reviveTimer.current) { clearTimeout(reviveTimer.current); reviveTimer.current = null; }
    const files = Array.from((e.target && e.target.files) || []);
    e.target.value = '';
    if (!files.length) { setUploading(false); setUploadingKind(null); return; }
    setUploadingKind(kind);
    setUpErr('');
    const slots = meta.refs - refs.length;
    if (slots <= 0) { setUpErr(t('max_prefix','Maksimal ') + meta.refs + t('files_suffix',' ta fayl')); return; }
    const typeRe = kind === 'audio' ? /^audio\// : (kind === 'video' ? /^video\// : /^image\//);
    const limitMB = kind === 'video' ? 50 : (kind === 'audio' ? 20 : 10);
    const batch = files.slice(0, slots);
    setUploading(true);
    for (const file of batch) {
      if (!typeRe.test(file.type || '')) { setUpErr(t('file_type_bad','Fayl turi mos emas')); continue; }
      if (file.size > limitMB * 1024 * 1024) { setUpErr(t('file_prefix','Fayl ') + limitMB + t('mb_too_big_suffix',' MB dan katta')); continue; }
      try { await uploadOne(file, kind); haptic('light'); }
      catch (err) { setUpErr((err && err.name === 'AbortError') ? t('upload_timeout','Yuklash cho\'zildi') : (err.message || t('not_connected','Ulanmadi'))); }
    }
    setUploading(false);
    setUploadingKind(null);
    setTimeout(() => setUploadKey((k) => k + 1), 100);
  };
  const onFile = onFileKind('image');
  const [showPasteBox, setShowPasteBox] = useState(false);
  const handleManualPaste = async (e) => {
    e.preventDefault();
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let file = null;
    for (const it of items) {
      if (it.kind === 'file' && it.type.indexOf('image/') === 0) { file = it.getAsFile(); break; }
    }
    setShowPasteBox(false);
    if (!file) { setUpErr(t('clip_no_img','Buferda rasm topilmadi')); return; }
    setUploading(true); setUpErr('');
    try { await uploadOne(file); haptic('light'); }
    catch (err) { setUpErr((err && err.message) || t('upload_err2','Yuklashda xato')); }
    setUploading(false);
    setTimeout(() => setUploadKey((k) => k + 1), 100);
  };
  const pasteImage = async () => {
    setUpErr('');
    if (refs.length >= meta.refs) { setUpErr(t('max_prefix','Maksimal ') + meta.refs + t('images_suffix',' ta rasm')); return; }
    /* 1-urinish: to'g'ridan clipboard.read (Android/desktop'da ishlaydi) */
    if (navigator.clipboard && navigator.clipboard.read) {
      try {
        const items = await navigator.clipboard.read();
        for (const it of items) {
          const t = (it.types || []).find((x) => x.indexOf('image/') === 0);
          if (t) {
            const blob = await it.getType(t);
            setUploading(true);
            const file = new File([blob], 'paste.' + ((blob.type.split('/')[1]) || 'png'), { type: blob.type });
            await uploadOne(file);
            haptic('light');
            setUploading(false);
            setTimeout(() => setUploadKey((k) => k + 1), 100);
            return;
          }
        }
        setUpErr(t('clip_no_img','Buferda rasm topilmadi'));
        return;
      } catch (err) { /* bloklangan (iOS Telegram) — paste-box'ga o'tamiz */ }
    }
    /* 2-yo'l: qo'lda Paste maydoni (iOS'da doim ishlaydi) */
    setShowPasteBox(true);
  };

  /* Qotish detektori: fokus qaytgach 2.5s fayl kutamiz.
     Fayl kelsa — hech narsa qilmaymiz (oddiy oqim buzilmaydi).
     Kelmasa — haqiqiy qotish: xabar + tugmalarni tiklash. */
  useEffect(() => {
    const onReturn = () => {
      if (!galleryTriedAt.current) return;            /* Galereya bosilmagan — aralashmaymiz */
      if (reviveTimer.current) clearTimeout(reviveTimer.current);
      reviveTimer.current = setTimeout(() => {
        reviveTimer.current = null;
        if (galleryTriedAt.current && !gotFileAfterTry.current) {
          setUploading(false);
          setUploadKey((k) => k + 1);
          setUpErr(t('gallery_lock_err','Galereya ochilmadi'));
        }
        galleryTriedAt.current = 0;
      }, 2500);
    };
    const onVis = () => { if (document.visibilityState === 'visible') onReturn(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onReturn);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onReturn);
      if (reviveTimer.current) clearTimeout(reviveTimer.current);
    };
  }, []);

  const removeRef = (id) => setRefs((prev) => prev.filter((x) => x.id !== id));
  const summary = [res, asp, dur ? dur + 's' : null, prompt.trim() ? '\u270D\uFE0F' : null].filter(Boolean).join(' · ');
  const price = getPrice(model, { res, dur });
  const psec = perSecInfo(model);
  const audRef = refs.find((r) => r.kind === 'audio' && r.duration > 0);
  const vidRefForPrice = refs.find((r) => r.kind === 'video' && r.duration > 0);
  const psecDur = psec ? (psec.unit === 'audio' ? (audRef ? audRef.duration : 0) : (vidRefForPrice ? vidRefForPrice.duration : 0)) : 0;
  const psecPrice = (psec && psecDur > 0) ? Math.max(1, Math.ceil(psec.perSec * psecDur)) : null;

  return (
    <div style={{ paddingBottom: 130 }}>
      <Header title={model.name} onBack={onBack} />

      <div className="rise" style={{ margin: '8px 16px', borderRadius: 20, padding: 16, position: 'relative', overflow: 'hidden', border: '1px solid rgba(43,212,255,0.28)', background: 'linear-gradient(160deg, rgba(43,212,255,0.14), rgba(255,255,255,0.04) 60%, rgba(10,12,16,0.3))', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.14), 0 14px 36px rgba(0,0,0,0.45)' }}>
        <div className="sheen" style={{ position: 'absolute', top: '-50%', left: 0, width: 60, height: '200%', background: 'linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent)' }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 13, marginBottom: 10, position: 'relative' }}>
          <EmojiTile emoji={model.emoji} id={model.id} size={50} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: c.text, letterSpacing: -0.3 }}>{model.name}</div>
            {model.badge ? <div style={{ fontSize: 12, color: c.blue, fontWeight: 600, marginTop: 1 }}>{model.badge}</div> : null}
          </div>
        </div>
        <div style={{ fontSize: 13.5, color: c.sub, lineHeight: 1.5, position: 'relative' }}>{(CUR_LANG === "ru" && meta.hookRu) ? meta.hookRu : (CUR_LANG === "en" && meta.hookEn) ? meta.hookEn : meta.hook}</div>
      </div>

      {meta.resolutions.length > 0 && (
        <div className="rise" style={{ animationDelay: '60ms' }}>
          <Label>{t('quality','SIFAT')}</Label>
          <Chips values={meta.resolutions} value={res} onPick={setRes} />
        </div>
      )}
      {meta.aspects.length > 0 && (
        <div className="rise" style={{ animationDelay: '100ms' }}>
          <Label>{t('ratio','NISBAT')}</Label>
          <Chips values={meta.aspects} value={asp} onPick={setAsp} />
        </div>
      )}
      {video && meta.dur_steps.length > 0 && (
        <div className="rise" style={{ animationDelay: '140ms' }}>
          <Label>{t('duration','DAVOMIYLIK')}</Label>
          <DurationSlider steps={meta.dur_steps} value={dur} onChange={setDur} />
        </div>
      )}

      {psec && (
        <div className="rise" style={{ margin: '14px 16px 0', display: 'flex', alignItems: 'center', gap: 10, padding: '13px 15px', borderRadius: 14, ...glass, fontSize: 13, color: c.text, lineHeight: 1.45, animationDelay: '150ms' }}>
          <Star size={16} fill={c.blue} color={c.blue} style={{ flex: 'none' }} />
          <span>{psecPrice != null ? (t('price_label_prefix','Narx: ') + psecPrice + ' \u26A1 (' + Math.round(psecDur) + 's ' + (psec.unit === 'audio' ? 'audio' : 'video') + ')') : (t('price_per_sec','Narx: har soniyasiga ~') + psec.perSec + ' \u26A1 — ' + (psec.unit === 'audio' ? 'audio' : 'video') + t('price_persec_tail',' yuklang, aniq narx chiqadi (maks ') + psec.max + 's).')}</span>
        </div>
      )}

      <div className="rise" style={{ animationDelay: '160ms' }}>
        <Label>{t('prompt_tavsif_label','PROMPT \u00B7 TAVSIF') + (prompt.length ? ' \u00B7 ' + prompt.length : ' \u00B7 ' + t('optional_word','IXTIYORIY'))}</Label>
        <div style={{ margin: '8px 16px 0' }}>
          <textarea
            value={prompt}
            onChange={(e) => setPrompt(clampBytes(e.target.value, 3400))}
            rows={4}
            placeholder={video ? t('ph_video','') : t('ph_image','')}
            style={{ width: '100%', boxSizing: 'border-box', minHeight: 106, resize: 'none', borderRadius: 16, padding: 14, fontSize: 15, lineHeight: 1.45, color: c.text, outline: 'none', caretColor: c.blue, fontFamily: font, ...glass }}
          />
        </div>
        <div style={{ margin: '10px 16px 0', display: 'flex', alignItems: 'center', gap: 10 }}>
          <button
            onClick={doEnhance}
            disabled={!prompt.trim() || enhancing}
            style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '9px 16px', borderRadius: 13, cursor: (!prompt.trim() || enhancing) ? 'default' : 'pointer', opacity: (!prompt.trim() || enhancing) ? 0.5 : 1, background: 'linear-gradient(135deg, rgba(56,132,255,0.28), rgba(56,132,255,0.12))', color: c.text, fontSize: 13.5, fontWeight: 600, fontFamily: font, WebkitBackdropFilter: 'blur(12px)', backdropFilter: 'blur(12px)', border: '1px solid rgba(56,132,255,0.35)' }}
          >
            {enhancing ? '\u2728 ' + t('enhancing_word','Yaxshilanmoqda') + '\u2026' : '\u2728 ' + t('enhance_btn','Yaxshilash')}
          </button>
          {prompt.trim() ? <span style={{ fontSize: 11, color: c.faint, lineHeight: 1.35 }}>{t('enhance_hint','AI promptni professional darajaga chiqaradi')}</span> : null}
        </div>
        {enhErr ? <div style={{ padding: '6px 18px 0', fontSize: 11.5, color: '#ff8a8a' }}>{enhErr}</div> : null}
        <div style={{ padding: '6px 18px 0', fontSize: 11.5, color: c.faint, lineHeight: 1.4 }}>{t('prompt_hint','G\'oyangizni qancha aniq yozsangiz, natija shuncha yaxshi chiqadi.')}</div>
      </div>

      {meta.refs > 0 && (() => {
        const imgRefs = refs.filter((r) => (r.kind || 'image') === 'image');
        const vidRefs = refs.filter((r) => r.kind === 'video');
        const audRefs = refs.filter((r) => r.kind === 'audio');
        const full = refs.length >= meta.refs;
        return (
        <div className="rise" style={{ margin: '18px 16px 0', animationDelay: '200ms' }}>
          {/* ── RASM ── */}
          <Label>{(isSeedance || needAudio) ? (t('lbl_rasm','RASM') + (meta.imgReq ? t('required_suffix',' \u00B7 MAJBURIY') : '')) : (t('lbl_ref_rasm','REFERENCE RASM') + (meta.refs_req ? t('required_suffix',' \u00B7 MAJBURIY') : ''))}</Label>
          <div style={{ margin: '8px 16px 0', display: 'flex', flexWrap: 'wrap', gap: 10 }}>
            {imgRefs.map((rf) => (
              <div key={rf.id} style={{ position: 'relative', width: 76, height: 76, borderRadius: 14, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.14)' }}>
                <img src={rf.preview} alt="ref" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                <button className="tap" onClick={() => removeRef(rf.id)} style={{ position: 'absolute', top: 3, right: 3, width: 22, height: 22, borderRadius: 11, border: 'none', background: 'rgba(0,0,0,0.65)', color: '#fff', fontSize: 13, lineHeight: '22px', padding: 0 }}>✕</button>
              </div>
            ))}
            {!full && (
              <React.Fragment key={'img' + uploadKey}>
                <label onClick={() => { galleryTriedAt.current = Date.now(); gotFileAfterTry.current = false; }} style={upTileStyle(uploadingKind === 'image', true)}>
                  {uploadingKind === 'image' ? <Spinner /> : <React.Fragment><Images size={22} strokeWidth={2} /><span style={upTileLabel}>{t('gallery_up','Galereya')}</span></React.Fragment>}
                  <input type="file" accept="image/*" multiple onChange={onFileKind('image')} style={upInputStyle} />
                </label>
                <label style={upTileStyle(uploadingKind === 'image', false)}>
                  {uploadingKind === 'image' ? <Spinner /> : <React.Fragment><Camera size={22} strokeWidth={2} /><span style={upTileLabel}>{t('camera','Kamera')}</span></React.Fragment>}
                  <input type="file" accept="image/*" capture="environment" onChange={onFileKind('image')} style={upInputStyle} />
                </label>
              </React.Fragment>
            )}
          </div>

          {/* ── VIDEO (faqat Seedance, ixtiyoriy) ── */}
          {needVideo && (
            <React.Fragment>
              <div style={{ height: 14 }} />
              <Label>{t('lbl_video','VIDEO') + (videoReq ? t('required_suffix',' \u00B7 MAJBURIY') : ' \u00B7 ' + t('optional_word','IXTIYORIY'))}</Label>
              <div style={{ margin: '8px 16px 0', display: 'flex', flexWrap: 'wrap', gap: 10 }}>
                {vidRefs.map((rf) => (
                  <div key={rf.id} style={{ position: 'relative', width: 76, height: 76, borderRadius: 14, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.14)', background: '#000' }}>
                    <video src={rf.preview} muted style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                    <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', pointerEvents: 'none' }}><Film size={20} color="#fff" /></div>
                    <button className="tap" onClick={() => removeRef(rf.id)} style={{ position: 'absolute', top: 3, right: 3, width: 22, height: 22, borderRadius: 11, border: 'none', background: 'rgba(0,0,0,0.65)', color: '#fff', fontSize: 13, lineHeight: '22px', padding: 0 }}>✕</button>
                  </div>
                ))}
                {!full && (
                  <label key={'vid' + uploadKey} style={upTileStyle(uploadingKind === 'video', false)}>
                    {uploadingKind === 'video' ? <Spinner /> : <React.Fragment><Film size={22} strokeWidth={2} /><span style={upTileLabel}>{t('video','Video')}</span></React.Fragment>}
                    <input type="file" accept="video/*,video/mp4,video/quicktime,.mp4,.mov,.webm" onChange={onFileKind('video')} style={upInputStyle} />
                  </label>
                )}
              </div>
            </React.Fragment>
          )}

          {/* ── AUDIO (faqat Seedance, ixtiyoriy) ── */}
          {needAudio && (
            <React.Fragment>
              <div style={{ height: 14 }} />
              <Label>{t('lbl_audio','AUDIO') + (audioReq ? t('required_suffix',' \u00B7 MAJBURIY') : ' \u00B7 ' + t('optional_word','IXTIYORIY'))}</Label>
              <div style={{ margin: '8px 16px 0', display: 'flex', flexWrap: 'wrap', gap: 10 }}>
                {audRefs.map((rf) => (
                  <div key={rf.id} style={{ position: 'relative', width: 76, height: 76, borderRadius: 14, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.14)', display: 'grid', placeItems: 'center', background: 'rgba(255,255,255,0.05)' }}>
                    <Mic size={24} color={c.sub} />
                    <button className="tap" onClick={() => removeRef(rf.id)} style={{ position: 'absolute', top: 3, right: 3, width: 22, height: 22, borderRadius: 11, border: 'none', background: 'rgba(0,0,0,0.65)', color: '#fff', fontSize: 13, lineHeight: '22px', padding: 0 }}>✕</button>
                  </div>
                ))}
                {!full && (
                  <label key={'aud' + uploadKey} style={upTileStyle(uploadingKind === 'audio', false)}>
                    {uploadingKind === 'audio' ? <Spinner /> : <React.Fragment><Mic size={22} strokeWidth={2} /><span style={upTileLabel}>{t('audio','Audio')}</span></React.Fragment>}
                    <input type="file" accept="audio/*,audio/mpeg,audio/mp4,audio/x-m4a,audio/wav,audio/aac,audio/ogg,.mp3,.m4a,.wav,.aac,.ogg" onChange={onFileKind('audio')} style={upInputStyle} />
                  </label>
                )}
              </div>
            </React.Fragment>
          )}

          {upErr ? <div style={{ padding: '10px 18px 0', fontSize: 12.5, color: '#FF6B6B' }}>{upErr}</div> : null}
          <div style={{ padding: '9px 18px 0', fontSize: 11.5, color: c.faint, lineHeight: 1.4 }}>{isSeedance ? t('ref_hint_full','Rasm — yuz/uslub. Video — harakat namunasi. Audio — ovoz (lipsync).') : (needAudio ? t('talkinghead_hint','Portret rasm + audio yuklang.') : (meta.refs_req ? t('ref_hint_face','Yuzni saqlash yoki uslub uchun rasm yuklang.') : t('ref_hint_optional','Ixtiyoriy — rasm asosida natija olishingiz mumkin.')))}</div>
        </div>
        );
      })()}

      {/* sticky CTA */}
      <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 20, display: 'flex', justifyContent: 'center', pointerEvents: 'none' }}>
        <div style={{ width: '100%', maxWidth: 430, display: 'flex', alignItems: 'center', gap: 13, padding: '14px 16px calc(16px + env(safe-area-inset-bottom))', pointerEvents: 'auto', background: 'linear-gradient(0deg, rgba(7,8,9,0.97) 55%, transparent)', backdropFilter: 'blur(18px)', WebkitBackdropFilter: 'blur(18px)', borderTop: '1px solid rgba(255,255,255,0.08)' }}>
          <div style={{ flex: 1, minWidth: 0, lineHeight: 1.25 }}>
            <div style={{ fontSize: 14.5, fontWeight: 700, color: c.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{model.name}</div>
            <div style={{ fontSize: 12, color: c.sub, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', ...num }}>{summary || '—'}</div>
          </div>
          <button className="tap" onClick={() => {
              if (needAudio && audioReq && !refs.some((r) => r.kind === 'audio')) { setUpErr(t('need_audio_req','Audio fayl yuklang (majburiy)')); return; }
              if (needVideo && videoReq && !refs.some((r) => r.kind === 'video')) { setUpErr(t('need_video_req','Video yuklang (majburiy)')); return; }
              if (meta.imgReq && !refs.some((r) => (r.kind || 'image') === 'image')) { setUpErr(t('need_portrait_req','Portret rasm yuklang (majburiy)')); return; }
              if (meta.refs_req && !meta.needAudio && refs.length === 0) { setUpErr(t('need_1img','Bu model kamida 1 ta rasm talab qiladi')); return; }
              haptic('medium');
              onSubmit({ res, asp, dur, prompt: prompt.trim(), refs: refs.map((x) => x.id), refPreviews: refs.map((x) => x.preview), estPrice: psecPrice, psecDur: Math.round(psecDur) });
            }} style={{ flex: 'none', display: 'flex', alignItems: 'center', gap: 8, padding: '14px 22px', borderRadius: 15, fontSize: 15, fontWeight: 700, ...glossy }}>
            {((price != null ? price : psecPrice) != null ? (price != null ? price : psecPrice) + ' ⚡ · ' : '') + t('continue_arrow','Davom etish →')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── CONFIRM SHEET ── */
function ConfirmSheet({ model, params, balance, onClose, onConfirm, openBuy }) {
  const meta = getMeta(model);
  const price = getPrice(model, params);
  const psec = perSecInfo(model);
  const effPrice = params.estPrice != null ? params.estPrice : price;
  const notEnough = balance != null && effPrice != null && effPrice > balance;
  const rows = [
    [t('param_quality','Sifat'), params.res],
    [t('param_ratio','Nisbat'), params.asp],
    params.dur ? [t('param_duration','Davomiylik'), params.dur + ' ' + t('sec_word','soniya')] : null,
    [t('param_price','Narx'), (params.estPrice != null ? params.estPrice + ' ⚡ (' + params.psecDur + 's)' : (psec ? '~' + psec.perSec + t('per_sec_suffix',' ⚡/soniya') : (price != null ? price + ' ⚡' : "Botda ko'rsatiladi")))],
  ].filter(Boolean);
  return (
    <div onClick={onClose} style={{ position: 'absolute', inset: 0, zIndex: 60, background: 'rgba(0,0,0,0.62)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)', display: 'flex', alignItems: 'flex-end' }}>
      <div className="sheet" onClick={(e) => e.stopPropagation()} style={{ width: '100%', borderRadius: '28px 28px 0 0', padding: '10px 16px calc(20px + env(safe-area-inset-bottom))', background: 'linear-gradient(180deg,#15161B,#0B0C0F)', border: '1px solid rgba(255,255,255,0.1)', borderBottom: 'none', boxShadow: '0 -20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12)' }}>
        <div style={{ width: 40, height: 4.5, borderRadius: 3, background: 'rgba(255,255,255,0.2)', margin: '6px auto 16px' }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 13, marginBottom: 14 }}>
          <EmojiTile emoji={model.emoji} id={model.id} size={48} />
          <div style={{ minWidth: 0 }}>

          </div>
        </div>
        <div style={{ borderRadius: 16, overflow: 'hidden', ...glass, boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.1)' }}>

            <div key={k} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 14px', borderBottom: i === rows.length - 1 ? 'none' : `1px solid ${c.hair}` }}>

              <span style={{ fontSize: k === t('param_price','Narx') ? 15.5 : 14.5, fontWeight: k === t('param_price','Narx') ? 800 : 700, color: k === t('param_price','Narx') ? c.blue : c.text, ...num }}>{v || '—'}</span>
            </div>
          ))}
        </div>
        {params.prompt ? (
          <div style={{ marginTop: 10, padding: '11px 13px', borderRadius: 14, ...glass, fontSize: 13, color: c.sub, lineHeight: 1.5 }}>
            <span style={{ color: c.faint, fontWeight: 700, fontSize: 11, letterSpacing: 0.4 }}>PROMPT \u00B7 </span>
            {params.prompt.length > 180 ? params.prompt.slice(0, 180) + '\u2026' : params.prompt}

          <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 9, fontSize: 12.5, color: c.blue, lineHeight: 1.4 }}>

          <div style={{ marginTop: 12, padding: '11px 13px', borderRadius: 12, background: 'rgba(255,80,80,0.1)', border: '1px solid rgba(255,90,90,0.35)', fontSize: 12.5, color: '#FF7A7A', textAlign: 'center', lineHeight: 1.4 }}>

          </div>
        ) : (
          <div style={{ marginTop: 12, fontSize: 12, color: c.faint, textAlign: 'center' }}>{price != null ? t('confirm_deduct','Tasdiqlasangiz balansdan ') + price + ' ⚡ yechiladi' : "Aniq narx botda ko'rsatiladi va balansdan yechiladi"}</div>
        )}
        {notEnough ? (
          <button className="tap" onClick={() => { haptic('medium'); openBuy && openBuy(); }} style={{ marginTop: 12, width: '100%', borderRadius: 16, padding: '15px 0', fontSize: 16.5, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, ...glossy }}>
            ⚡ Tanga to'ldirish
          </button>
        ) : (
          <button className="tap" onClick={onConfirm} style={{ marginTop: 12, width: '100%', borderRadius: 16, padding: '15px 0', fontSize: 16.5, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, ...glossy }}>
            <Check size={19} strokeWidth={3} /> {t('confirm_send','Tasdiqlash va yuborish')}{price != null ? ' · ' + price + ' ⚡' : ''}

          {t('cancel_btn','Bekor qilish')}
        </button>
      </div>
    </div>
  );
}

const galleryDownload = async (it, setMsg) => {
  const tg = TG();
  const url = API_BASE + it.url;
  const fname = (it.type === 'video' ? 'voro-video-' : 'voro-rasm-') + (it.id ? it.id.slice(0, 8) : Date.now()) + (it.type === 'video' ? '.mp4' : '.png');
  try {
    if (tg && tg.downloadFile) { setMsg('id', '…'); tg.downloadFile({ url, file_name: fname }, (ok) => setMsg('id', ok ? '✓' : '')); return; }
  } catch (e) { /* keyingi */ }
  try {
    setMsg('id', '…');
    const r = await fetch(url); const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    setMsg('id', '✓');
  } catch (e) {
    try { if (tg && tg.openLink) tg.openLink(url); } catch (e2) { window.open(url, '_blank'); }
  }
};

function TemplateScreen({ template, balance, onBack, onGenerate }) {
  const [styleId, setStyleId] = useState(null);
  const [refs, setRefs] = useState([]);   /* [{id, url, preview}] */
  const [uploading, setUploading] = useState(false);
  const [upErr, setUpErr] = useState('');
  const [uploadKey, setUploadKey] = useState(0);
  const styles = template.styles || [];
  const maxRefs = template.refs || 1;
  const cost = template.cost;
  const notEnough = balance != null && cost != null && cost > balance;

  const uploadOne = async (file) => {
    const preview = URL.createObjectURL(file);
    const fd = new FormData(); fd.append('file', file);
    const tg = TG();
    const headers = {};
    const initData = tg && tg.initData ? tg.initData : '';
    if (initData) headers['X-Tg-Init-Data'] = initData;
    const uid = URLQ.get('uid'), sig = URLQ.get('sig'), n = URLQ.get('n');
    if (uid && sig) { headers['X-Tg-Uid'] = uid; headers['X-Tg-Sig'] = sig; if (n) headers['X-Tg-Name'] = n; }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    let r;
    try { r = await fetch(API_BASE + '/tg/upload', { method: 'POST', headers, body: fd, signal: ctrl.signal }); }
    finally { clearTimeout(timer); }
    let d = {};
    try { d = await r.json(); } catch (e) { d = {}; }
    if (!r.ok) throw new Error(d.error || (t('upload_err_code','Yuklashda xato (') + r.status + ')'));
    if (!d.upload_id) throw new Error(t('server_err','Server javobida xato'));
    setRefs((prev) => [...prev, { id: d.upload_id, url: d.url, preview }]);
  };
  const onFile = async (e) => {
    const files = Array.from((e.target && e.target.files) || []);
    e.target.value = '';
    if (!files.length) { setUploading(false); return; }
    setUpErr('');
    const slots = maxRefs - refs.length;
    if (slots <= 0) { setUpErr(t('max_prefix','Maksimal ') + maxRefs + t('images_suffix',' ta rasm')); return; }
    setUploading(true);
    for (const file of files.slice(0, slots)) {
      if (!/^image\//.test(file.type || '')) { setUpErr(t('only_image_file','Faqat rasm fayli')); continue; }
      if (file.size > 10 * 1024 * 1024) { setUpErr(t('img_too_big','Rasm 10 MB dan katta')); continue; }
      try { await uploadOne(file); haptic('light'); }
      catch (err) { setUpErr(err.message || t('not_connected','Ulanmadi')); }
    }
    setUploading(false);
    setTimeout(() => setUploadKey((k) => k + 1), 100);
  };
  const removeRef = (id) => setRefs((prev) => prev.filter((r) => r.id !== id));

  const canGen = styleId && refs.length > 0 && !notEnough;
  const doGen = () => {
    if (!styleId) { setUpErr(t('choose_style','Uslub tanlang')); return; }
    if (refs.length === 0) { setUpErr(t('upload_img','Rasm yuklang')); return; }
    if (notEnough) { setUpErr(t('not_enough','Balans yetarli emas')); return; }
    haptic('medium');
    onGenerate({ template_id: template.id, style_id: styleId, refs: refs.map((r) => r.id), refPreviews: refs.map((r) => r.preview), cost: cost });
  };

  const cleanName = (template.name || '').replace(/^(\p{Emoji}\uFE0F?\s*)/u, '');
  return (
    <div style={{ paddingBottom: 120 }}>
      <Header title={cleanName} onBack={onBack} />
      {template.desc && <div style={{ padding: '4px 18px 0', fontSize: 13.5, color: c.sub, lineHeight: 1.5 }}>{template.desc}</div>}

      {/* USLUB TANLASH */}
      <div style={{ padding: '18px 16px 8px', fontSize: 15, fontWeight: 700, color: c.text }}>{t('choose_style',t('choose_style','Uslub tanlang'))}</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, padding: '0 16px' }}>
        {styles.map((st) => {
          const active = styleId === st.id;
          return (
            <button key={st.id} className="tap" onClick={() => { setStyleId(st.id); haptic('light'); setUpErr(''); }}
              style={{ borderRadius: 14, padding: '14px 14px', textAlign: 'left', fontSize: 14.5, fontWeight: 600, color: active ? '#00161F' : c.text, ...(active ? glossy : glass), transition: 'all .15s' }}>
              {st.label || st.id}
            </button>
          );
        })}
      </div>

      {/* RASM YUKLASH */}
      <div style={{ padding: '20px 16px 8px', fontSize: 15, fontWeight: 700, color: c.text }}>{t('your_photo','Rasmingiz')}</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, padding: '0 16px' }}>
        {refs.map((rf) => (
          <div key={rf.id} style={{ position: 'relative', width: 84, height: 84, borderRadius: 14, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.14)' }}>
            <img src={rf.preview} alt="ref" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            <button className="tap" onClick={() => removeRef(rf.id)} style={{ position: 'absolute', top: 3, right: 3, width: 22, height: 22, borderRadius: 11, border: 'none', background: 'rgba(0,0,0,0.65)', color: '#fff', fontSize: 13, lineHeight: '22px', padding: 0 }}>✕</button>
          </div>
        ))}
        {refs.length < maxRefs && (
          <React.Fragment key={uploadKey}>
            <label style={{ ...upTileStyle(uploading, true), width: 84, height: 84 }}>
              {uploading ? <Spinner /> : <React.Fragment><Images size={22} strokeWidth={2} /><span style={upTileLabel}>{t('gallery_up','Galereya')}</span></React.Fragment>}
              <input type="file" accept="image/*" multiple onChange={onFile} style={upInputStyle} />
            </label>
            <label style={{ ...upTileStyle(uploading, false), width: 84, height: 84 }}>
              {uploading ? <Spinner /> : <React.Fragment><Camera size={22} strokeWidth={2} /><span style={upTileLabel}>{t('camera','Kamera')}</span></React.Fragment>}
              <input type="file" accept="image/*" capture="environment" onChange={onFile} style={upInputStyle} />
            </label>
          </React.Fragment>
        )}
      </div>
      <div style={{ padding: '9px 18px 0', fontSize: 11.5, color: c.faint, lineHeight: 1.4 }}>{t('portrait_hint','Yuzingiz aniq ko\'ringan portret yuklang.')}</div>
      {upErr ? <div style={{ padding: '8px 18px 0', fontSize: 12.5, color: '#FF6B6B' }}>{upErr}</div> : null}

      {/* CTA */}
      <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 20, display: 'flex', justifyContent: 'center', pointerEvents: 'none' }}>
        <div style={{ width: '100%', maxWidth: 430, padding: '14px 16px calc(16px + env(safe-area-inset-bottom))', pointerEvents: 'auto', background: 'linear-gradient(0deg, rgba(7,8,9,0.97) 55%, transparent)', backdropFilter: 'blur(18px)', WebkitBackdropFilter: 'blur(18px)', borderTop: '1px solid rgba(255,255,255,0.08)' }}>
          <button className="tap" onClick={doGen} disabled={!canGen} style={{ width: '100%', padding: '15px 0', borderRadius: 16, fontSize: 15.5, fontWeight: 700, ...(canGen ? glossy : { ...glass, color: c.faint }) }}>
            {notEnough ? t('not_enough','Balans yetarli emas') : ((cost != null ? cost + ' ⚡ · ' : '') + 'Yaratish')}
          </button>
        </div>
      </div>
    </div>
  );
}

function ToolListScreen({ tools, onBack, openTool }) {
  return (
    <div>
      <Header title={t('tools','Vositalar')} onBack={onBack} />
      <div style={{ padding: '4px 18px 14px', fontSize: 13.5, color: c.sub, lineHeight: 1.5 }}>{t('tools_desc',t('tools_subtitle','Fotorasmlar bilan ishlash uchun vositalar'))}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 11, padding: '0 16px' }}>
        {tools.map((t, i) => (
          <button key={t.id} className="tap rise" onClick={() => openTool(t)} style={{ borderRadius: 16, padding: '14px 15px', display: 'flex', alignItems: 'center', gap: 13, textAlign: 'left', animationDelay: Math.min(i * 45, 300) + 'ms', ...glass }}>
            <IconTile icon={TOOL_ICON(t.id)} size={46} tone="cyan" />

function ToolScreen({ tool, balance, onBack, onGenerate }) {
  const isForm = tool.input === 'form';
  const imgSlots = isForm ? (tool.images || []) : [{ key: '_single', label: t('single_image_label','Rasm') }];
  const fields = isForm ? (tool.fields || []) : [];
  const [imgs, setImgs] = useState({});   /* {slotKey: {id, url, preview}} */
  const [vals, setVals] = useState({});   /* {fieldKey: text} */
  const [uploadingKey, setUploadingKey] = useState(null);
  const [upErr, setUpErr] = useState('');
  const [uploadKey, setUploadKey] = useState(0);
  const cost = tool.cost;
  const notEnough = balance != null && cost != null && cost > balance;

  const uploadOne = async (file, slotKey) => {
    const preview = URL.createObjectURL(file);
    const fd = new FormData(); fd.append('file', file);
    const tg = TG();
    const headers = {};
    const initData = tg && tg.initData ? tg.initData : '';
    if (initData) headers['X-Tg-Init-Data'] = initData;
    const uid = URLQ.get('uid'), sig = URLQ.get('sig'), n = URLQ.get('n');
    if (uid && sig) { headers['X-Tg-Uid'] = uid; headers['X-Tg-Sig'] = sig; if (n) headers['X-Tg-Name'] = n; }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    let r;
    try { r = await fetch(API_BASE + '/tg/upload', { method: 'POST', headers, body: fd, signal: ctrl.signal }); }
    finally { clearTimeout(timer); }
    let d = {};
    try { d = await r.json(); } catch (e) { d = {}; }
    if (!r.ok) throw new Error(d.error || (t('upload_err_code','Yuklashda xato (') + r.status + ')'));
    if (!d.upload_id) throw new Error(t('server_err','Server javobida xato'));
    setImgs((prev) => ({ ...prev, [slotKey]: { id: d.upload_id, url: d.url, preview } }));
  };
  const onFile = async (e, slotKey) => {
    const files = Array.from((e.target && e.target.files) || []);
    e.target.value = '';
    if (!files.length) { setUploadingKey(null); return; }
    setUpErr('');
    const file = files[0];
    if (!/^image\//.test(file.type || '')) { setUpErr(t('only_image_file','Faqat rasm fayli')); return; }
    if (file.size > 10 * 1024 * 1024) { setUpErr(t('img_too_big','Rasm 10 MB dan katta')); return; }
    setUploadingKey(slotKey);
    try { await uploadOne(file, slotKey); haptic('light'); }
    catch (err) { setUpErr(err.message || t('not_connected','Ulanmadi')); }
    setUploadingKey(null);
    setTimeout(() => setUploadKey((k) => k + 1), 100);
  };

  const allImgsReady = imgSlots.every((s) => imgs[s.key]);
  const allFieldsFilled = fields.every((f) => (vals[f.key] || '').trim().length > 0);
  const canGen = allImgsReady && (fields.length === 0 || allFieldsFilled) && !notEnough;
  const doGen = () => {
    if (!allImgsReady) { setUpErr(t('upload_all_imgs','Barcha rasmlarni yuklang')); return; }
    if (fields.length > 0 && !allFieldsFilled) { setUpErr(t('fill_all_fields','Barcha maydonlarni to\'ldiring')); return; }
    if (notEnough) { setUpErr(t('not_enough','Balans yetarli emas')); return; }
    haptic('medium');
    /* rasmlar tartibi: imgSlots tartibida */
    const refIds = imgSlots.map((s) => imgs[s.key].id);
    const previews = imgSlots.map((s) => imgs[s.key].preview);
    onGenerate({ tool_id: tool.id, refs: refIds, refPreviews: previews, fields: vals, cost: cost });
  };

  return (
    <div style={{ paddingBottom: 130 }}>
      <Header title={tool.name} onBack={onBack} />
      {tool.desc && <div style={{ padding: '4px 18px 0', fontSize: 13.5, color: c.sub, lineHeight: 1.5 }}>{tool.desc}</div>}

      {/* RASMLAR */}
      <div style={{ padding: '18px 16px 8px', fontSize: 15, fontWeight: 700, color: c.text }}>{imgSlots.length > 1 ? t('images_title','Rasmlar') : t('your_image','Rasmingiz')}</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12, padding: '0 16px' }}>
        {imgSlots.map((slot) => {
          const cur = imgs[slot.key];
          return (
            <div key={slot.key} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
              {cur ? (
                <div style={{ position: 'relative', width: 104, height: 104, borderRadius: 14, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.14)' }}>
                  <img src={cur.preview} alt={slot.label} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                  <button className="tap" onClick={() => setImgs((prev) => { const n = { ...prev }; delete n[slot.key]; return n; })} style={{ position: 'absolute', top: 3, right: 3, width: 22, height: 22, borderRadius: 11, border: 'none', background: 'rgba(0,0,0,0.65)', color: '#fff', fontSize: 13, lineHeight: '22px', padding: 0 }}>✕</button>
                </div>
              ) : (
                <label key={uploadKey} style={{ ...upTileStyle(uploadingKey === slot.key, true), width: 104, height: 104 }}>
                  {uploadingKey === slot.key ? <Spinner /> : <React.Fragment><Images size={22} strokeWidth={2} /><span style={upTileLabel}>{t('upload','Yuklash')}</span></React.Fragment>}
                  <input type="file" accept="image/*" onChange={(e) => onFile(e, slot.key)} style={upInputStyle} />
                </label>
              )}
              <span style={{ fontSize: 12, color: c.sub, fontWeight: 600 }}>{slot.label}</span>
            </div>
          );
        })}
      </div>

      {/* MATN MAYDONLARI */}
      {fields.length > 0 && (
        <React.Fragment>
          <div style={{ padding: '20px 16px 8px', fontSize: 15, fontWeight: 700, color: c.text }}>{t('info_fields','Ma\'lumotlar')}</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 11, padding: '0 16px' }}>
            {fields.map((f) => (
              <div key={f.key}>
                <div style={{ fontSize: 12.5, color: c.sub, fontWeight: 600, marginBottom: 5, paddingLeft: 2 }}>{f.label}</div>
                <input type="text" value={vals[f.key] || ''} placeholder={f.placeholder || ''} onChange={(e) => setVals((prev) => ({ ...prev, [f.key]: e.target.value }))}
                  style={{ width: '100%', boxSizing: 'border-box', padding: '13px 15px', borderRadius: 13, fontSize: 15, color: c.text, background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', outline: 'none', fontFamily: font }} />
              </div>
            ))}
          </div>
        </React.Fragment>
      )}

      {upErr ? <div style={{ padding: '10px 18px 0', fontSize: 12.5, color: '#FF6B6B' }}>{upErr}</div> : null}

      <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 20, display: 'flex', justifyContent: 'center', pointerEvents: 'none' }}>
        <div style={{ width: '100%', maxWidth: 430, padding: '14px 16px calc(16px + env(safe-area-inset-bottom))', pointerEvents: 'auto', background: 'linear-gradient(0deg, rgba(7,8,9,0.97) 55%, transparent)', backdropFilter: 'blur(18px)', WebkitBackdropFilter: 'blur(18px)', borderTop: '1px solid rgba(255,255,255,0.08)' }}>
          <button className="tap" onClick={doGen} disabled={!canGen} style={{ width: '100%', padding: '15px 0', borderRadius: 16, fontSize: 15.5, fontWeight: 700, ...(canGen ? glossy : { ...glass, color: c.faint }) }}>
            {notEnough ? t('not_enough','Balans yetarli emas') : ((cost != null ? cost + ' ⚡ · ' : '') + 'Yaratish')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── RESULT SHEET (generatsiya natijasi Mini App ichida) ── */
function ResultSheet({ job, onClose, onRetry, goGallery }) {
  const done = job.status === 'done';
  const failed = job.status === 'failed';
  const running = !done && !failed;
  const mediaUrl = job.result_url ? (API_BASE + job.result_url) : null;

  const [dlMsg, setDlMsg] = useState('');
  const download = async () => {
    if (!mediaUrl) return;
    const tg = TG();
    const fname = (job.type === 'video' ? 'voro-video-' : 'voro-rasm-') + Date.now() + (job.type === 'video' ? '.mp4' : '.png');
    /* 1-usul: Telegram downloadFile (galereyaga/Fayllarga saqlaydi, brauzerga O'TMAYDI) */
    try {
      if (tg && tg.downloadFile) {
        setDlMsg(t('dl_loading','Yuklanmoqda…'));
        tg.downloadFile({ url: mediaUrl, file_name: fname }, (ok) => {
          setDlMsg(ok ? t('dl_saved','Saqlandi ✓') : '');
        });
        return;
      }
    } catch (e) { /* keyingi usul */ }
    /* 2-usul: blob orqali <a download> (qurilmaga saqlaydi) */
    try {
      setDlMsg(t('dl_loading','Yuklanmoqda…'));
      const r = await fetch(mediaUrl);
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setDlMsg(t('dl_saved','Saqlandi ✓'));
      return;
    } catch (e) { /* oxirgi chora */ }
    /* 3-usul: oxirgi chora — Telegram ichida ochish */
    try { if (tg && tg.openLink) tg.openLink(mediaUrl); } catch (e) { window.open(mediaUrl, '_blank'); }
  };

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 70, background: 'rgba(0,0,0,0.82)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 18 }}>
      <div className="rise" style={{ width: '100%', maxWidth: 400, borderRadius: 24, overflow: 'hidden', background: 'linear-gradient(180deg,#15161B,#0B0C0F)', border: '1px solid rgba(255,255,255,0.12)', boxShadow: '0 20px 70px rgba(0,0,0,0.7)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '15px 16px', borderBottom: '1px solid rgba(255,255,255,0.07)' }}>
          <EmojiTile emoji={job.model.emoji} id={job.model.id} size={38} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15.5, fontWeight: 800, color: c.text }}>{job.model.name}</div>
            <div style={{ fontSize: 12.5, color: running ? c.blue : (done ? '#4ADE80' : '#FF6B6B'), fontWeight: 600 }}>
              {running ? t('creating_dots','Yaratilmoqda…') : done ? t('done_check','Tayyor ✓') : t('error_word','Xatolik')}
            </div>
          </div>
          {(done || failed) && (
            <button className="tap" onClick={onClose} style={{ border: 'none', background: 'rgba(255,255,255,0.09)', color: c.text, borderRadius: 10, width: 32, height: 32, fontSize: 16 }}>✕</button>
          )}
        </div>

        {/* MEDIA / PROGRESS */}
        <div style={{ position: 'relative', width: '100%', aspectRatio: job.type === 'video' ? '16/9' : '1/1', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
          {done && mediaUrl ? (
            job.type === 'video'
              ? <video src={mediaUrl} controls autoPlay playsInline loop style={{ width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
              : <img src={mediaUrl} alt={t('result_alt','natija')} style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
          ) : (
            <>
              {job.preview && <img src={job.preview} alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: 0.25, filter: 'blur(2px)' }} />}
              <div style={{ position: 'relative', textAlign: 'center', padding: 20 }}>
                {failed ? (
                  <>
                    <div style={{ fontSize: 40, marginBottom: 8 }}>⚠️</div>
                    <div style={{ fontSize: 14, color: '#FF9B9B', lineHeight: 1.5, maxWidth: 280 }}>{job.error || t('error_occurred','Xatolik yuz berdi')}</div>
                    <div style={{ fontSize: 12.5, color: c.sub, marginTop: 8 }}>{t('refunded','Tangacha qaytarildi.')}</div>
                  </>
                ) : (
                  <>
                    <div style={{ width: 54, height: 54, margin: '0 auto 14px', border: '3px solid rgba(43,212,255,0.25)', borderTopColor: c.blue, borderRadius: '50%', animation: 'spin 0.9s linear infinite' }} />
                    <div style={{ fontSize: 14.5, fontWeight: 700, color: c.text }}>{t('generating','Yaratilmoqda…')}</div>
                    <div style={{ fontSize: 12.5, color: c.sub, marginTop: 4 }}>{t('gen_time2',t('takes_1_3_min','Bu 1-3 daqiqa olishi mumkin'))}</div>
                    <div style={{ width: 180, height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.12)', margin: '14px auto 0', overflow: 'hidden' }}>
                      <div style={{ width: (job.progress || 5) + '%', height: '100%', background: c.blue, borderRadius: 3, transition: 'width 0.5s' }} />
                    </div>
                  </>
                )}
              </div>
            </>
          )}
        </div>

        {/* ACTIONS */}
        <div style={{ padding: '14px 16px calc(14px + env(safe-area-inset-bottom))', display: 'flex', gap: 10 }}>
          {done ? (
            <>
              <button className="tap" onClick={download} style={{ flex: 1, padding: '13px 0', borderRadius: 14, fontSize: 14.5, fontWeight: 700, ...glossy }}><span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, justifyContent: 'center' }}>{dlMsg ? dlMsg : <React.Fragment><Download size={18} /> Yuklab olish</React.Fragment>}</span></button>
              <button className="tap" onClick={goGallery} style={{ flex: 'none', padding: '13px 18px', borderRadius: 14, fontSize: 14.5, fontWeight: 700, color: c.text, background: 'rgba(255,255,255,0.09)', border: 'none' }}>{t('gallery_up','Galereya')}</button>
            </>
          ) : failed ? (
            <>
              <button className="tap" onClick={onRetry} style={{ flex: 1, padding: '13px 0', borderRadius: 14, fontSize: 14.5, fontWeight: 700, ...glossy }}>{t('retry',t('retry_btn','Qayta urinish'))}</button>
              <button className="tap" onClick={onClose} style={{ flex: 'none', padding: '13px 18px', borderRadius: 14, fontSize: 14.5, fontWeight: 700, color: c.text, background: 'rgba(255,255,255,0.09)', border: 'none' }}>{t('close','Yopish')}</button>
            </>
          ) : (
            <div style={{ flex: 1, textAlign: 'center', fontSize: 12.5, color: c.faint, padding: '6px 0' }}>{t('result_saved2',t('close_app_note','Ilovani yopsangiz ham, natija Galereyada saqlanadi.'))}</div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [tab, setTab] = useState('home');
  const [cat, setCat] = useState('video');
  const [model, setModel] = useState(null);
  const [confirmData, setConfirmData] = useState(null); // {res, asp, dur}
  const [showBuy, setShowBuy] = useState(false);
  const [balance, setBalance] = useState(null);
  const [userName, setUserName] = useState('Ijodkor');
  const [userHandle, setUserHandle] = useState('');
  const [job, setJob] = useState(null); /* {status, progress, result_url, type, model, error} */
  const [templates, setTemplates] = useState([]);   /* backend'dan shablonlar */
  const [activeTemplate, setActiveTemplate] = useState(null);   /* tanlangan shablon */
  const [tools, setTools] = useState([]);   /* backend'dan vositalar */
  const [activeTool, setActiveTool] = useState(null);   /* tanlangan vosita */
  const [lang, setLangState] = useState(CUR_LANG);
  const [langSheet, setLangSheet] = useState(false);
  const setLang = (l) => {
    if (!LANGS[l]) return;
    CUR_LANG = l; setLangState(l); haptic('light');
    try { const tg = TG(); if (tg && tg.CloudStorage) tg.CloudStorage.setItem('voro_lang', l); } catch (e) {}
  };

  useEffect(() => {
    const tg = TG();
    if (!tg) return;
    try { tg.ready(); tg.expand(); } catch (e) { /* noop */ }
    /* Til: saqlangandan yoki Telegram tilidan */
    try {
      if (tg.CloudStorage && tg.CloudStorage.getItem) {
        tg.CloudStorage.getItem('voro_lang', (err, val) => {
          if (!err && val && LANGS[val]) { CUR_LANG = val; setLangState(val); }
          else { const d = detectLang(); CUR_LANG = d; setLangState(d); }
        });
      } else { const d = detectLang(); CUR_LANG = d; setLangState(d); }
    } catch (e) { const d = detectLang(); CUR_LANG = d; setLangState(d); }
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) { /* noop */ }
    try { tg.setHeaderColor('#070809'); tg.setBackgroundColor('#070809'); } catch (e) { /* noop */ }
    try {
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u) { setUserName(u.first_name || 'Ijodkor'); setUserHandle(u.username ? '@' + u.username : ''); }
      const p = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      if (p && /^bal\d+$/.test(p)) setBalance(parseInt(p.slice(3), 10));
      /* Bot imzolangan URL'dan ism va balans (KeyboardButton holati) */
      const un = URLQ.get('n'); if (un) setUserName(decodeURIComponent(un));
      const ub = URLQ.get('bal'); if (ub && /^\d+$/.test(ub)) setBalance(parseInt(ub, 10));
    } catch (e) { /* noop */ }
    /* Backend'dan jonli ism + balans (lazy migration shu yerda ishga tushadi) */
    apiFetch('/tg/me')
      .then((me) => {
        if (me && me.name) setUserName(me.name);
        if (me && typeof me.balance === 'number') setBalance(me.balance);
      })
      .catch(() => { /* backend yetmasa start_param balansi qoladi */ });
    /* Shablonlar */
    apiFetch('/tg/templates')
      .then((d) => { if (d && Array.isArray(d.templates)) setTemplates(d.templates); })
      .catch(() => { /* shablonsiz ishlaydi */ });
    apiFetch('/tg/tools')
      .then((d) => { if (d && Array.isArray(d.tools)) setTools(d.tools); })
      .catch(() => { /* vositasiz ishlaydi */ });
  }, []);

  /* Telegram BackButton — har qadamda to'g'ri "orqaga" */
  useEffect(() => {
    const tg = TG();
    if (!tg || !tg.BackButton) return;
    const handler = () => {
      haptic('light');
      if (job && (job.status === 'done' || job.status === 'failed')) setJob(null);
      else if (job) { /* ishlayotganda yopmaymiz — foydalanuvchi kutadi */ }
      else if (confirmData) setConfirmData(null);
      else if (showBuy) setShowBuy(false);
      else if (activeTool) { setActiveTool(null); setTab('home'); }
      else if (activeTemplate) { setActiveTemplate(null); setTab('home'); }
      else if (model) setModel(null);
      else if (tab !== 'home') setTab('home');
    };
    try { tg.BackButton.onClick(handler); } catch (e) { /* noop */ }
    const needBack = job || confirmData || showBuy || model || activeTemplate || activeTool || tab !== 'home';
    try { needBack ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) { /* noop */ }
    return () => { try { tg.BackButton.offClick(handler); } catch (e) { /* noop */ } };
  }, [confirmData, showBuy, model, tab, job, activeTemplate, activeTool]);

  const openModel = (m) => { setCat(isVideoModel(m) ? 'video' : 'image'); setModel(m); setTab('create'); haptic('medium'); };
  const openTemplate = (t) => { setActiveTemplate(t); setTab('template'); haptic('medium'); };
  const openTool = (t) => { setActiveTool(t); setTab('tool'); haptic('medium'); };
  const openToolList = () => { setTab('toollist'); haptic('medium'); };
  const goCat = (k) => { setCat(k); setModel(null); setTab('create'); haptic('medium'); };
  const submitParams = (params) => setConfirmData(params);
  const apiPost = async (path, body) => {
    const tg = TG();
    const headers = { 'Content-Type': 'application/json' };
    const initData = tg && tg.initData ? tg.initData : '';
    if (initData) headers['X-Tg-Init-Data'] = initData;
    const uid = URLQ.get('uid'), sig = URLQ.get('sig'), n = URLQ.get('n');
    if (uid && sig) { headers['X-Tg-Uid'] = uid; headers['X-Tg-Sig'] = sig; if (n) headers['X-Tg-Name'] = n; }
    const r = await fetch(API_BASE + path, { method: 'POST', headers, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    return { ok: r.ok, status: r.status, data: d };
  };

  const confirmSend = async () => {
    if (!model || !confirmData) return;
    hapticOk();
    const preview = (confirmData.refPreviews && confirmData.refPreviews[0]) || null;
    const isVid = isVideoModel(model);
    setConfirmData(null);
    setJob({ status: 'queued', progress: 5, type: isVid ? 'video' : 'image', model, preview, result_url: null, error: null });
    const payload = { mid: model.id, res: confirmData.res, asp: confirmData.asp };
    if (confirmData.dur) payload.dur = confirmData.dur;
    if (confirmData.prompt) payload.prompt = confirmData.prompt;
    if (confirmData.refs && confirmData.refs.length) payload.refs = confirmData.refs;

    const res = await apiPost('/tg/generate', payload);
    if (!res.ok || !res.data.job_id) {
      const msg = res.status === 402 ? t('not_enough','Balans yetarli emas') : (res.data.error || t('error_occurred','Xatolik yuz berdi'));
      setJob((j) => j ? { ...j, status: 'failed', error: msg } : null);
      return;
    }
    if (typeof res.data.balance === 'number') setBalance(res.data.balance);
    const jobId = res.data.job_id;

    /* Poll — har 3s da holatni tekshiramiz */
    const poll = async () => {
      try {
        const jr = await apiFetch('/tg/job/' + jobId);
        if (typeof jr.balance === 'number') setBalance(jr.balance);
        if (jr.status === 'done') {
          hapticOk();
          setJob((j) => j ? { ...j, status: 'done', progress: 100, result_url: jr.result_url } : null);
          return;
        }
        if (jr.status === 'failed') {
          setJob((j) => j ? { ...j, status: 'failed', error: jr.error || t('gen_failed','Generatsiya amalga oshmadi') } : null);
          return;
        }
        setJob((j) => j ? { ...j, status: jr.status, progress: Math.min(95, jr.progress || j.progress) } : null);
        setTimeout(poll, 3000);
      } catch (e) { setTimeout(poll, 4000); }
    };
    setTimeout(poll, 2500);
  };
  const closeJob = () => setJob(null);

  const templateGenerate = async (data) => {
    hapticOk();
    const preview = (data.refPreviews && data.refPreviews[0]) || null;
    setActiveTemplate(null);
    setTab('home');
    setJob({ status: 'queued', progress: 5, type: 'image', model: { name: t('template_word','Shablon'), emoji: '✨', id: 'template' }, preview, result_url: null, error: null });
    const payload = { template_id: data.template_id, style_id: data.style_id, refs: data.refs };
    const res = await apiPost('/tg/generate', payload);
    if (!res.ok || !res.data.job_id) {
      const msg = res.status === 402 ? t('not_enough','Balans yetarli emas') : (res.data.error || t('error_occurred','Xatolik yuz berdi'));
      setJob((j) => j ? { ...j, status: 'failed', error: msg } : null);
      return;
    }
    if (typeof res.data.balance === 'number') setBalance(res.data.balance);
    const jobId = res.data.job_id;
    const poll = async () => {
      try {
        const jr = await apiFetch('/tg/job/' + jobId);
        if (typeof jr.balance === 'number') setBalance(jr.balance);
        if (jr.status === 'done') { hapticOk(); setJob((j) => j ? { ...j, status: 'done', progress: 100, result_url: jr.result_url } : null); return; }
        if (jr.status === 'failed') { setJob((j) => j ? { ...j, status: 'failed', error: jr.error || t('gen_failed','Generatsiya amalga oshmadi') } : null); return; }
        setJob((j) => j ? { ...j, status: jr.status, progress: Math.min(95, jr.progress || j.progress) } : null);
        setTimeout(poll, 3000);
      } catch (e) { setTimeout(poll, 4000); }
    };
    setTimeout(poll, 2500);
  };

  const toolGenerate = async (data) => {
    hapticOk();
    const preview = (data.refPreviews && data.refPreviews[0]) || null;
    setActiveTool(null);
    setTab('home');
    setJob({ status: 'queued', progress: 5, type: 'image', model: { name: t('job_type_word','Vosita'), emoji: '✨', id: 'tool' }, preview, result_url: null, error: null });
    const payload = { tool_id: data.tool_id, refs: data.refs };
    if (data.fields) payload.fields = data.fields;
    const res = await apiPost('/tg/generate', payload);
    if (!res.ok || !res.data.job_id) {
      const msg = res.status === 402 ? t('not_enough','Balans yetarli emas') : (res.data.error || t('error_occurred','Xatolik yuz berdi'));
      setJob((j) => j ? { ...j, status: 'failed', error: msg } : null);
      return;
    }
    if (typeof res.data.balance === 'number') setBalance(res.data.balance);
    const jobId = res.data.job_id;
    const poll = async () => {
      try {
        const jr = await apiFetch('/tg/job/' + jobId);
        if (typeof jr.balance === 'number') setBalance(jr.balance);
        if (jr.status === 'done') { hapticOk(); setJob((j) => j ? { ...j, status: 'done', progress: 100, result_url: jr.result_url } : null); return; }
        if (jr.status === 'failed') { setJob((j) => j ? { ...j, status: 'failed', error: jr.error || t('amalga_oshmadi','Amalga oshmadi') } : null); return; }
        setJob((j) => j ? { ...j, status: jr.status, progress: Math.min(95, jr.progress || j.progress) } : null);
        setTimeout(poll, 3000);
      } catch (e) { setTimeout(poll, 4000); }
    };
    setTimeout(poll, 2500);
  };

  const inParams = tab === 'create' && !!model;
  const inTemplate = tab === 'template' && !!activeTemplate;
  const inTool = tab === 'tool' && !!activeTool;
  const hideNav = inParams || inTemplate || inTool;

  return (
    <div style={{ background: '#000', minHeight: '100vh', display: 'flex', justifyContent: 'center', fontFamily: font }}>
      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes sheen { 0% { transform: translateX(-140%) rotate(8deg); } 100% { transform: translateX(560%) rotate(8deg); } }
        @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,46px); } }
        @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-44px,26px); } }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
        .rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
        .sheen { animation: sheen 7s ease-in-out infinite; }
        .sheet { animation: sheetUp .32s cubic-bezier(.2,.8,.2,1) both; }
        .tap { transition: transform .12s ease, opacity .12s ease; cursor: pointer; }
        .tap:active { transform: scale(0.97); opacity: 0.9; }
        input::placeholder, textarea::placeholder { color: rgba(236,241,248,0.34); }
        .noscroll::-webkit-scrollbar { display: none; }
        .noscroll { -ms-overflow-style: none; scrollbar-width: none; }
        @media (prefers-reduced-motion: reduce) { .rise,.sheen,.sheet { animation: none !important; } }
      `}</style>
      <div style={{ width: '100%', maxWidth: 430, minHeight: '100vh', position: 'relative', overflow: 'hidden', background: c.bg }}>
        <div style={{ position: 'absolute', top: -90, left: -60, width: 300, height: 300, borderRadius: '50%', background: 'radial-gradient(circle, rgba(43,212,255,0.3), transparent 70%)', filter: 'blur(20px)', animation: 'drift1 18s ease-in-out infinite', zIndex: 0 }} />
        <div style={{ position: 'absolute', top: '40%', right: -80, width: 260, height: 260, borderRadius: '50%', background: 'radial-gradient(circle, rgba(10,132,255,0.26), transparent 70%)', filter: 'blur(22px)', animation: 'drift2 22s ease-in-out infinite', zIndex: 0 }} />
        <div style={{ position: 'absolute', bottom: -60, left: '30%', width: 220, height: 220, borderRadius: '50%', background: 'radial-gradient(circle, rgba(43,212,255,0.18), transparent 70%)', filter: 'blur(20px)', animation: 'drift1 26s ease-in-out infinite', zIndex: 0 }} />

        <div className="noscroll" style={{ position: 'relative', zIndex: 1, height: '100vh', overflowY: 'auto', paddingBottom: hideNav ? 0 : 112 }}>
          {tab === 'home' && <HomeScreen balance={balance} userName={userName} goCat={goCat} openModel={openModel} openBuy={() => setShowBuy(true)} templates={templates} openTemplate={openTemplate} tools={tools} openTool={openTool} openToolList={openToolList} lang={lang} onFlagClick={() => setLangSheet(true)} />}
          {tab === 'create' && !model && <ModelListScreen cat={cat} setCat={setCat} openModel={openModel} />}
          {tab === 'create' && model && <ParamsScreen key={model.id} model={model} onBack={() => setModel(null)} onSubmit={submitParams} />}
          {tab === 'template' && activeTemplate && <TemplateScreen key={activeTemplate.id} template={activeTemplate} balance={balance} onBack={() => { setActiveTemplate(null); setTab('home'); }} onGenerate={templateGenerate} />}
          {tab === 'toollist' && <ToolListScreen tools={tools} onBack={() => setTab('home')} openTool={openTool} />}
          {tab === 'tool' && activeTool && <ToolScreen key={activeTool.id} tool={activeTool} balance={balance} onBack={() => { setActiveTool(activeTool); setActiveTool(null); setTab('toollist'); }} onGenerate={toolGenerate} />}
          {tab === 'gallery' && <GalleryScreen goCreate={() => goCat('video')} />}
          {tab === 'profile' && <ProfileScreen balance={balance} userName={userName} userHandle={userHandle} openBuy={() => setShowBuy(true)} lang={lang} setLang={setLang} />}
        </div>

        {!hideNav && <TabBar tab={tab} setTab={(k) => { setModel(null); setTab(k); }} />}
        {showBuy && <BuyScreen onClose={() => setShowBuy(false)} />}
        {langSheet && (
          <div onClick={() => setLangSheet(false)} style={{ position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(6px)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
            <div onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: 430, background: c.card, borderRadius: '22px 22px 0 0', padding: '10px 16px calc(20px + env(safe-area-inset-bottom))', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
              <div style={{ width: 38, height: 4, borderRadius: 2, background: 'rgba(255,255,255,0.2)', margin: '6px auto 16px' }} />
              <div style={{ fontSize: 17, fontWeight: 700, color: c.text, marginBottom: 14, textAlign: 'center' }}>{t('choose_lang', 'Tilni tanlang')}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {Object.keys(LANGS).map((code) => (
                  <button key={code} className="tap" onClick={() => { setLang(code); setLangSheet(false); }}
                    style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '15px 16px', borderRadius: 14, fontSize: 16, fontWeight: 600, ...(lang === code ? glossy : glass) }}>
                    <span style={{ fontSize: 22 }}>{LANG_FLAG[code]}</span>
                    <span style={{ flex: 1, textAlign: 'left', color: lang === code ? '#00161F' : c.text }}>{LANGS[code]}</span>
                    {lang === code ? <Check size={18} strokeWidth={3} color="#00161F" /> : null}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}
        {confirmData && model && <ConfirmSheet model={model} params={confirmData} balance={balance} onClose={() => setConfirmData(null)} onConfirm={confirmSend} openBuy={() => { setConfirmData(null); setShowBuy(true); }} />}
        {job && <ResultSheet job={job} onClose={closeJob} onRetry={() => { const m = job.model; closeJob(); setModel(m); setTab('create'); }} goGallery={() => { closeJob(); setModel(null); setTab('gallery'); }} />}

        <div style={{ position: 'absolute', inset: 0, zIndex: 70, pointerEvents: 'none', opacity: 0.08, mixBlendMode: 'overlay', backgroundImage: noise, backgroundSize: '150px 150px' }} />
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
